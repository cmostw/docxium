<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 642" width="880" height="642" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">docxium speed-up over python-docx</title>
<desc id="d">Horizontal bars show how many times faster docxium is than python-docx for build, text extraction and the total, across five workloads. Values are printed next to each bar, with the measured times in the right-hand column.</desc>
