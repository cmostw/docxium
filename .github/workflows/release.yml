# Publishes to PyPI with Trusted Publishing (OIDC); no API token is stored in the repository.
#
# PyPI setup: add a trusted publisher for the project "docxium" with
#   owner: cmostw, repository: docxium, workflow: release.yml, environment: pypi.
#
# Trigger: push a tag named v<version>, for example v0.1.0.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/CI.yml

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/docxium
    permissions:
      # OIDC token for PyPI and for the attestation
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tag matches the package version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          versions = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "Cargo.toml": tomllib.load(open("Cargo.toml", "rb"))["package"]["version"],
          }
          mismatched = {name: v for name, v in versions.items() if v != tag}
          if mismatched:
              raise SystemExit(f"tag {tag} does not match {mismatched}")
          PY
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always 'wheels-*/*'
