<text x="164.0" y="212" font-size="11" text-anchor="middle" fill="#898781">0</text>
<line x1="253.3" y1="46" x2="253.3" y2="196" stroke="#e1e0d9" stroke-width="1"/>
<text x="253.3" y="212" font-size="11" text-anchor="middle" fill="#898781">25×</text>
<line x1="342.6" y1="46" x2="342.6" y2="196" stroke="#e1e0d9" stroke-width="1"/>
<text x="342.6" y="212" font-size="11" text-anchor="middle" fill="#898781">50×</text>
<line x1="431.9" y1="46" x2="431.9" y2="196" stroke="#e1e0d9" stroke-width="1"/>
<text x="431.9" y="212" font-size="11" text-anchor="middle" fill="#898781">75×</text>
<line x1="521.1" y1="46" x2="521.1" y2="196" stroke="#e1e0d9" stroke-width="1"/>
<text x="521.1" y="212" font-size="11" text-anchor="middle" fill="#898781">100×</text>
<line x1="610.4" y1="46" x2="610.4" y2="196" stroke="#e1e0d9" stroke-width="1"/>
<text x="610.4" y="212" font-size="11" text-anchor="middle" fill="#898781">125×</text>
<line x1="164" y1="46" x2="164" y2="196" stroke="#c3c2b7" stroke-width="1"/>
<text x="150" y="65.0" font-size="13" text-anchor="end" fill="#52514e">1,000 paragraphs</text>
<path d="M164.0,52.0 h48.3 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-48.3 z" fill="#2a78d6"/>
