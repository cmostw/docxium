[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "docxium"
version = "0.1.0"
description = "python-docx extended with batch operations implemented in Rust"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["python-docx>=1.2,<2"]

[tool.maturin]
python-source = "python"
module-name = "docxium._core"
exclude = ["**/*.pdb"]

[tool.maturin.generate-ci.github]
pytest = true
trusted-publishing = true
publishing-environment = "pypi"

[tool.maturin.generate-ci.github.linux]
targets = ["x86_64", "aarch64"]

[tool.maturin.generate-ci.github.windows]
targets = ["x64"]

[tool.maturin.generate-ci.github.macos]
targets = ["x86_64", "aarch64"]
