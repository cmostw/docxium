# Builds the wheels and the sdist and tests every wheel on the oldest and a recent Python.
# release.yml calls this workflow and publishes the artifacts.
#
# Every wheel is built and tested on a runner of its own architecture. Linux arm64 has no
# "latest" runner label, so a versioned one is used.

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: windows-x64
            runner: windows-latest
          - name: macos-aarch64
            runner: macos-latest
          - name: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          manylinux: auto
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: dist
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Test the wheel
        shell: bash
        run: |
          set -e
          for version in 3.9 3.14; do
            uv venv --python "$version" ".venv-$version"
            uv pip install --python ".venv-$version" dist/*.whl
            uv run --no-project --python ".venv-$version" python -m unittest discover tests
          done

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload the sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
